name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_browsers:
        description: Also run Firefox and WebKit
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_ALL: ${{ inputs.all_browsers && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm test -- --coverage
      - name: Hook tests
        run: node --test ".claude/hooks/*.test.mjs"
      - name: Engine files match their pinned hashes
        run: node scripts/vendor-engine.mjs --check
      - name: Build
        run: npm run build
      - name: Lighthouse CI (score + budget)
        run: npx lhci autorun
      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.all_browsers }}
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium ${{ inputs.all_browsers && 'firefox webkit' || '' }}
      # The runner image already ships Chromium's libs; apt here hung twice for 10 min.
      - name: Install Firefox/WebKit system deps
        if: inputs.all_browsers
        timeout-minutes: 5
        run: npx playwright install-deps firefox webkit
      - name: e2e
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
